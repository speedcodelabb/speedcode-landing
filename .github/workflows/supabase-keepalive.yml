name: Supabase keep-alive

# El plan Free de Supabase pausa un proyecto tras 7 días sin actividad. Una
# lectura diaria del contenido publicado (la misma que hace la landing con la
# clave anónima) lo mantiene activo y avisa si la API deja de responder.
# Nota: GitHub desactiva los workflows programados de repos públicos tras 60
# días sin commits; si eso ocurre, reactivarlo desde la pestaña Actions.

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production
            url_var: SUPABASE_PROD_URL
            key_var: SUPABASE_PROD_ANON_KEY
          - name: staging
            url_var: SUPABASE_STAGING_URL
            key_var: SUPABASE_STAGING_ANON_KEY
    name: ping ${{ matrix.name }}
    steps:
      - name: Leer el contenido publicado
        env:
          SUPABASE_URL: ${{ vars[matrix.url_var] }}
          SUPABASE_ANON_KEY: ${{ vars[matrix.key_var] }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" || { echo "::error::Faltan las variables de ${{ matrix.name }}"; exit 1; }
          status=$(curl -sS -o response.json -w '%{http_code}' --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/site_content?id=eq.1&select=version" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "HTTP $status: $(cat response.json)"
          test "$status" = 200 || { echo "::error::Supabase ${{ matrix.name }} respondió $status"; exit 1; }
